<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f6f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121619" media="(prefers-color-scheme: dark)" />
    <title>Keine Verbindung</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f6f6;
        --surface: #ffffff;
        --ink: #24262b;
        --ink-2: #474b52;
        --hero-from: #24262b;
        --hero-to: #3a414b;
        --on-hero: #ffffff;
        --shadow: 0 1px 2px rgb(0 0 0 / 0.04), 0 6px 20px rgb(0 0 0 / 0.06);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121619;
          --surface: #1b2025;
          --ink: #eef2f3;
          --ink-2: #c9d1d6;
          --hero-from: #aecfd5;
          --hero-to: #c6b8de;
          --on-hero: #121619;
          --shadow: none;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        font-family:
          "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        background: var(--bg);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%;
      }
      main {
        width: 100%;
        max-width: 28rem;
        padding: 32px 24px 36px;
        text-align: center;
        background: var(--surface);
        border-radius: 24px;
        box-shadow: var(--shadow);
        animation: rein 260ms ease both;
      }
      .symbol {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 20px;
        color: var(--on-hero);
        background: linear-gradient(135deg, var(--hero-from), var(--hero-to));
        box-shadow: var(--shadow);
      }
      .symbol svg {
        width: 36px;
        height: 36px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 2rem;
        line-height: 1.15;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        font-size: 1.0625rem;
        line-height: 1.5;
        color: var(--ink-2);
      }
      @keyframes rein {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        main {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="symbol" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 3l18 18" />
          <path d="M8.5 16.4a5 5 0 0 1 7 0" />
          <path d="M5 12.9a10 10 0 0 1 3.3-2.2M12 8a14 14 0 0 1 7 2.9" />
          <path d="M2 8.8a15 15 0 0 1 4-2.6M10.4 5.1A15 15 0 0 1 22 8.8" />
          <path d="M12 20h.01" />
        </svg>
      </div>
      <h1>Keine Verbindung</h1>
      <p>
        Die App erreicht den Server gerade nicht. Eine laufende Einheit kannst du wieder öffnen,
        sobald das Netz zurück ist. Bereits erfasste Sätze bleiben auf dem Gerät erhalten und werden
        dann gespeichert.
      </p>
    </main>
  </body>
</html>
