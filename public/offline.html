<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <title>Keine Verbindung</title>
    <style>
      body {
        margin: 0;
        padding: 24px 16px;
        font-family: system-ui, sans-serif;
        background: #fafafa;
        color: #171717;
      }
      main {
        max-width: 28rem;
        margin: 48px auto 0;
        padding: 16px;
        text-align: center;
        background: #fff;
        border: 1px solid #e5e5e5;
        border-radius: 12px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
      }
      p {
        margin: 0;
        color: #525252;
        line-height: 1.5;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0a0a0a;
          color: #f5f5f5;
        }
        main {
          background: #171717;
          border-color: #262626;
        }
        p {
          color: #a3a3a3;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Keine Verbindung</h1>
      <p>
        Die App erreicht den Server gerade nicht. Eine laufende Einheit kannst du wieder öffnen,
        sobald das Netz zurück ist. Bereits erfasste Sätze bleiben auf dem Gerät erhalten und
        werden dann gespeichert.
      </p>
    </main>
  </body>
</html>
